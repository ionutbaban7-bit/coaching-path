# coachinghub.ro — Render Blueprint
#
# The forum needs a same-origin API, so the primary deployment is the
# zero-dependency Node service. It keeps the existing static pages and adds
# GET/POST /api/forum. For durable production community data, set
# FORUM_DATA_FILE to a persistent disk or replace the adapter with a database.

services:
  - type: web
    name: coachinghub-ro
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"

# Static fallback (without the shared forum API):
# Render → New → Static Site → branch main → Publish Directory: .
# The forum UI still works locally per browser in this mode.
