name: Deploy to GitHub Pages

# Se declanșează la push pe main. Pentru a publica din alt branch,
# folosește Actions → „Deploy to GitHub Pages” → Run workflow → alege branch-ul.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Pregătește Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Nu publicăm un site rupt: verificăm sintaxa, referințele locale, paritatea RO/EN
      - name: Verifică site-ul
        run: node tools/check-site.mjs

      # enablement: dacă Pages nu e pornit încă în setările repo-ului, îl pornește
      # automat cu sursa „GitHub Actions” (altfel pasul cade cu „Get Pages site failed”)
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
